name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run tsc
      - run: npm run lint
      - run: npm run build

      - name: Package
        run: |
          npx headlamp-plugin package . release
          cd release
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$(cd release && ls -- *.tar.gz)"
          digest="$(cut -d' ' -f1 release/SHA256SUMS)"
          cat > notes.md <<EOF
          Plugin archive \`$archive\`, SHA-256 \`$digest\`.

          To ship it in k3dlamp, run \`scripts/update-plugin.sh $GITHUB_REF_NAME\` there.
          EOF
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
